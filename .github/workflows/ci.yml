name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; every pushed commit keeps a finished run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 2

  readme-bash:
    # Replays the README macOS/Linux block. Keep both in sync in the same commit.
    name: readme (bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: README block (git clone and cd are replaced by checkout)
        run: |
          python3 -c "import sys; assert sys.version_info >= (3, 10), 'Necesitas Python 3.10 o superior'"
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt
          python manage.py migrate
          python manage.py runserver 127.0.0.1:8000 --noreload > runserver.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ -o health.json && break
            sleep 1
          done
          cat runserver.log
          test "$(cat health.json)" = '{"status":"ok","database":"ok"}'

  readme-powershell:
    # Windows counterpart of readme (bash). It runs the README Windows steps (version check,
    # venv, pip install, migrate) with the setup-python interpreter (`python`), because the
    # `py` launcher is not guaranteed on the runner image. It ends with `manage.py check`
    # instead of the foreground `runserver`; the server itself is exercised by readme (bash).
    # One step per line so no failure is masked.
    name: readme (powershell)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -c "import sys; assert sys.version_info >= (3, 10), 'Necesitas Python 3.10 o superior'"
      - run: python -m venv .venv
      - run: .venv\Scripts\python -m pip install -r requirements.txt
      - run: .venv\Scripts\python manage.py migrate
      - run: .venv\Scripts\python manage.py check

  frontend:
    name: frontend (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Replays the README Docker block: both images build, nginx serves the SPA and forwards /api to Django.
    name: docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: nginx forwards the API to Django
        run: test "$(curl -fsS http://127.0.0.1:8080/api/v1/health/)" = '{"status":"ok","database":"ok"}'
      - name: nginx serves the SPA on client-side routes
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/rastreo | grep -q '<div id="root">'
      - name: Django admin is reachable through nginx
        run: curl -fsS -o /dev/null http://127.0.0.1:8080/admin/login/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
