name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; every pushed commit keeps a finished run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 2

  readme-bash:
    # Replays the README macOS/Linux block. Keep both in sync in the same commit.
    name: readme (bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: README block (git clone and cd are replaced by checkout)
        run: |
          python3 -c "import sys; assert sys.version_info >= (3, 10), 'Necesitas Python 3.10 o superior'"
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt
          python manage.py migrate
          python manage.py runserver 127.0.0.1:8000 --noreload > runserver.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ -o health.json && break
            sleep 1
          done
          cat runserver.log
          test "$(cat health.json)" = '{"status":"ok","database":"ok"}'

  readme-powershell:
    # Replays the README Windows block, one step per line so no failure is masked.
    name: readme (powershell)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python --version
      - run: python -m venv .venv
      - run: .venv\Scripts\python -m pip install -r requirements.txt
      - run: .venv\Scripts\python manage.py migrate
      - run: .venv\Scripts\python manage.py check
