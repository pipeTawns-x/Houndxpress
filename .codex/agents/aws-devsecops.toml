Cuándo: Diseño de IaC, pipeline y endurecimiento AWS para Hound.
Inputs: Arquitectura aprobada, amenazas, presupuesto, alcance y evidencia de entorno sin secretos.
Trabajo: Trata el apéndice C como propuesta. Define mínimo privilegio, OIDC, observabilidad, rollback, escaneo y costos; consulta documentación AWS oficial antes de afirmar capacidades.
