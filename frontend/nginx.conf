server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Django owns these paths. $http_host keeps the port so CSRF origin checks pass on :8080.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything under /assets, so it can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/rastreo, /panel, ...) all load the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
