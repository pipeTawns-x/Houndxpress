server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A location that declares its own add_header stops inheriting these, so none may declare one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # Nothing public starts with a dot. nginx tries regex locations in order and they beat the
    # prefix ones, so this also keeps the SPA fallback from answering /.env with 200.
    location ~ /\. {
        return 404;
    }

    # Django owns these paths. $http_host keeps the port so CSRF origin checks pass on :8080.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        # This server block sets these headers, so Django's copies would only duplicate them.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything under /assets, so it can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/rastreo, /panel, ...) all load the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
