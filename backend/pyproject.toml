[project]
name = "houndxpress-backend"
version = "0.1.0"
description = "Waybill tracking API for Hound Express (EBAC capstone)."
requires-python = ">=3.10"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.19",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["ruff>=0.16,<0.17"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM"]
